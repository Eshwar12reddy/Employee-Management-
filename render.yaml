services:
  - type: web
    name: clyptus-api
    runtime: node
    buildCommand: npm ci && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clyptus-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JSON_BODY_LIMIT
        value: 4mb
      - key: SESSION_TTL_HOURS
        value: 12
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: none

  - type: static
    name: clyptus-frontend
    buildCommand: npm ci && npm run build --workspace frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: clyptus-db
    plan: free
